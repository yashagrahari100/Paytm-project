
name: Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/paytm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Setup npm
        run: npm install -g npm@11.6.0

      - name: Verify versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma
        run: npm ls prisma @prisma/client --workspace=@repo/db

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build
