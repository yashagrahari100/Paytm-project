name: Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing"
            exit 1
          else
            echo "DATABASE_URL is available"
          fi
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/paytm"

      - name: Generate prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/paytm"

      - name: Run Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/paytm"
